name: food-store-calculator

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: food_store
      POSTGRES_PASSWORD: food_store
      POSTGRES_USER: food_store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_store -d food_store"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - food-store-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ./api
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgres://food_store:food_store@db:5432/food_store?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      API_ADDRESS: :8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://food_store:food_store@db:5432/food_store?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://api:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://web:3000"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3000:3000"

volumes:
  food-store-postgres:
